<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CORE CASCADE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='32,4 58,19 58,45 32,60 6,45 6,19' fill='%23070b18' stroke='%2300f0ff' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #0d1734 0%, #050812 65%, #03050b 100%);
      color: #dce9ff;
      font-family: "Segoe UI", "Consolas", monospace;
      user-select: none;
      padding: 8px;
      overflow: hidden;
    }
    .cabinet {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 14px;
      border-radius: 14px;
      background: rgba(9, 14, 29, 0.88);
      border: 1px solid #1e325c;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.75), 0 0 28px rgba(0, 240, 255, 0.12);
    }
    canvas#game-canvas {
      display: block;
      border-radius: 8px;
      background: #060913;
      box-shadow: inset 0 0 18px rgba(0, 240, 255, 0.08);
    }
    .status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: #89a7db;
      background: #070c1a;
      border: 1px solid #172749;
      border-radius: 6px;
    }
    .status-bar strong {
      color: #00f0ff;
    }
  </style>
</head>
<body>
  <main class="cabinet">
    <canvas id="game-canvas" width="560" height="640" aria-label="CORE CASCADE playfield"></canvas>
    <div class="status-bar">
      <strong>CORE CASCADE</strong>
      <span id="game-status">READY</span>
    </div>
  </main>
  <script type="module" src="./src/ui/main.mjs"></script>
</body>
</html>
